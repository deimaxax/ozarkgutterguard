<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M256 32 L440 96 C440 280 360 416 256 480 C152 416 72 280 72 96 Z" fill="url(#shieldGrad)" stroke="#334155" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Inner Shield Inset -->
  <path d="M256 56 L416 112 C416 268 348 384 256 444 C164 384 96 268 96 112 Z" fill="none" stroke="#ea580c" stroke-width="4" stroke-opacity="0.6" />

  <!-- Stylized Roofline & Gutter Protection Angle -->
  <path d="M140 230 L256 140 L372 230 L350 250 L256 176 L162 250 Z" fill="url(#accentGrad)" />

  <!-- 316 Surgical Micro-Mesh Grid Symbol -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <!-- Horizontal mesh wires -->
    <line x1="180" y1="280" x2="332" y2="280" />
    <line x1="190" y1="304" x2="322" y2="304" />
    <line x1="205" y1="328" x2="307" y2="328" />
    <line x1="225" y1="352" x2="287" y2="352" />

    <!-- Vertical mesh wires -->
    <line x1="210" y1="270" x2="210" y2="335" />
    <line x1="233" y1="260" x2="233" y2="355" />
    <line x1="256" y1="255" x2="256" y2="365" />
    <line x1="279" y1="260" x2="279" y2="355" />
    <line x1="302" y1="270" x2="302" y2="335" />
  </g>

  <!-- Water Drop Ingress Center -->
  <path d="M256 380 C246 395 240 405 240 415 C240 424 247 431 256 431 C265 431 272 424 272 415 C272 405 266 395 256 380 Z" fill="#38bdf8" />

  <!-- Verified Badge Star at Crest -->
  <polygon points="256,76 262,94 280,94 266,104 271,122 256,111 241,122 246,104 232,94 250,94" fill="#fbbf24" />
</svg>
