<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="truckBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#truckBg)" />

  <!-- Road & Grid Floor -->
  <rect x="0" y="580" width="1200" height="220" fill="#090d16" stroke="#334155" stroke-width="2" />
  <line x1="0" y1="680" x2="1200" y2="680" stroke="#f59e0b" stroke-width="6" stroke-dasharray="30,20" />

  <!-- Contractor Service Vehicle Graphic -->
  <g transform="translate(80, 260)">
    <!-- Main Van / Truck Box Body -->
    <rect x="180" y="40" width="480" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" />
    <!-- Cab -->
    <path d="M 660 120 L 750 180 L 780 230 L 780 300 L 660 300 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" />
    <path d="M 670 140 L 730 190 L 730 220 L 670 220 Z" fill="#38bdf8" opacity="0.6" stroke="#0284c7" stroke-width="2" />

    <!-- Orange Brand Stripe -->
    <rect x="180" y="160" width="480" height="60" fill="url(#truckBody)" />
    
    <!-- Branding Text on Vehicle -->
    <text x="210" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">OZARK GUTTER GUARD CO.</text>
    <text x="210" y="198" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1">SURGICAL MICRO-MESH &amp; CLEANING</text>
    <text x="210" y="248" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BENTONVILLE, AR • DISPATCH: (479) 929-2516</text>

    <!-- Wheels -->
    <circle cx="280" cy="300" r="45" fill="#0f172a" stroke="#64748b" stroke-width="8" />
    <circle cx="280" cy="300" r="20" fill="#94a3b8" />
    <circle cx="700" cy="300" r="45" fill="#0f172a" stroke="#64748b" stroke-width="8" />
    <circle cx="700" cy="300" r="20" fill="#94a3b8" />

    <!-- Roof Rack with 6-inch Seamless Extruder Machine & Ladders -->
    <rect x="150" y="20" width="460" height="15" rx="3" fill="#64748b" />
    <!-- Ladders -->
    <line x1="140" y1="12" x2="620" y2="12" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
    <line x1="140" y1="4" x2="620" y2="4" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Right Dispatch Dashboard -->
  <g transform="translate(740, 80)">
    <rect width="400" height="460" rx="16" fill="#0f172a" stroke="#ea580c" stroke-width="2" opacity="0.95" />
    
    <text x="30" y="45" fill="#ea580c" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MOBILE FLEET DISPATCH</text>
    <text x="30" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">Northwest Arkansas Crew</text>

    <g transform="translate(30, 110)">
      <rect width="340" height="55" rx="8" fill="#1e293b" />
      <text x="15" y="24" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="800">PRIMARY HEADQUARTERS</text>
      <text x="15" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1102 S Walton Blvd, Bentonville, AR</text>
    </g>

    <g transform="translate(30, 180)">
      <rect width="340" height="55" rx="8" fill="#1e293b" />
      <text x="15" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">DAILY DISPATCH RADIUS</text>
      <text x="15" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bentonville • Bella Vista • Rogers • Fayetteville</text>
    </g>

    <g transform="translate(30, 250)">
      <rect width="340" height="55" rx="8" fill="#1e293b" />
      <text x="15" y="24" fill="#facc15" font-family="system-ui, sans-serif" font-size="10" font-weight="800">LICENSING &amp; INSURANCE</text>
      <text x="15" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AR Lic. #OGG-479-NWA • $2M Liability</text>
    </g>

    <g transform="translate(30, 320)">
      <rect width="340" height="55" rx="8" fill="#1e293b" />
      <text x="15" y="24" fill="#ea580c" font-family="system-ui, sans-serif" font-size="10" font-weight="800">ON-SITE EQUIPMENT</text>
      <text x="15" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">6" Seamless Extruder • Laser Levels</text>
    </g>

    <text x="30" y="415" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="800">
      ● 4 Active Mobile Crews On-Call
    </text>
  </g>
</svg>
