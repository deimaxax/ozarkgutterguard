<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#flowBg)" />

  <!-- Title & Top Spec -->
  <text x="60" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">LABORATORY HYDRODYNAMIC WATER TESTING</text>
  <text x="60" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="900">316 Surgical Micro-Mesh vs. National Competitors</text>
  <text x="60" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Simulated Peak Ozark Thunderstorm Rain Rate: 2.5 to 3.0 Inches / Hour</text>

  <!-- 3 Comparison Columns -->
  <!-- Col 1: Ozark Gutter Guard -->
  <g transform="translate(60, 180)">
    <rect width="330" height="500" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <rect x="0" y="0" width="330" height="60" rx="16" fill="#064e3b" />
    <text x="20" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="900">OZARK GUTTER GUARD</text>

    <text x="20" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MATERIAL SPEC</text>
    <text x="20" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">316 Surgical Stainless Steel</text>
    <text x="20" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">50-Micron Open Mesh Weave</text>

    <!-- Gauge Bar 100% -->
    <rect x="20" y="180" width="290" height="30" rx="6" fill="#1e293b" />
    <rect x="20" y="180" width="290" height="30" rx="6" fill="#10b981" />
    <text x="35" y="201" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900">150 IN/HR FLOW (100% PASS)</text>

    <text x="20" y="250" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PINE NEEDLE INFILTRATION</text>
    <text x="20" y="275" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="900">0% (Zero Clog)</text>

    <text x="20" y="320" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SHINGLE WARRANTY IMPACT</text>
    <text x="20" y="345" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="900">0% Contact (100% Safe)</text>

    <text x="20" y="390" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TYPICAL 200 LF COST</text>
    <text x="20" y="420" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="900">$1,450 – $1,750</text>
    <text x="20" y="445" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Turnkey contractor rate</text>
  </g>

  <!-- Col 2: LeafFilter / uPVC Micro-Mesh -->
  <g transform="translate(435, 180)">
    <rect width="330" height="500" rx="16" fill="#0f172a" stroke="#f97316" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="60" rx="16" fill="#431407" />
    <text x="20" y="38" fill="#fb923c" font-family="system-ui, sans-serif" font-size="16" font-weight="900">NATIONAL FRANCHISE</text>

    <text x="20" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MATERIAL SPEC</text>
    <text x="20" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">uPVC Plastic Base + 304 Mesh</text>
    <text x="20" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">150–250 Micron Aperture</text>

    <!-- Gauge Bar 40% -->
    <rect x="20" y="180" width="290" height="30" rx="6" fill="#1e293b" />
    <rect x="20" y="180" width="130" height="30" rx="6" fill="#f97316" />
    <text x="35" y="201" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900">60 IN/HR FLOW</text>

    <text x="20" y="250" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PINE NEEDLE INFILTRATION</text>
    <text x="20" y="275" fill="#f87171" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Catkin Sludge Caking</text>

    <text x="20" y="320" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SHINGLE WARRANTY IMPACT</text>
    <text x="20" y="345" fill="#f87171" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Tucked Under Shingles</text>

    <text x="20" y="390" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TYPICAL 200 LF COST</text>
    <text x="20" y="420" fill="#f87171" font-family="system-ui, sans-serif" font-size="28" font-weight="900">$5,500 – $7,200</text>
    <text x="20" y="445" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">High commission franchise</text>
  </g>

  <!-- Col 3: Hardware Store Vinyl / Screen -->
  <g transform="translate(810, 180)">
    <rect width="330" height="500" rx="16" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <rect x="0" y="0" width="330" height="60" rx="16" fill="#1e293b" />
    <text x="20" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16" font-weight="900">BIG-BOX RETAIL DIY</text>

    <text x="20" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MATERIAL SPEC</text>
    <text x="20" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Molded Vinyl / Punched Tin</text>
    <text x="20" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">1,000+ Micron Large Slits</text>

    <!-- Gauge Bar 25% -->
    <rect x="20" y="180" width="290" height="30" rx="6" fill="#1e293b" />
    <rect x="20" y="180" width="80" height="30" rx="6" fill="#ef4444" />
    <text x="35" y="201" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900">35 IN/HR FLOW</text>

    <text x="20" y="250" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PINE NEEDLE INFILTRATION</text>
    <text x="20" y="275" fill="#ef4444" font-family="system-ui, sans-serif" font-size="16" font-weight="700">100% Piercing Failure</text>

    <text x="20" y="320" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SHINGLE WARRANTY IMPACT</text>
    <text x="20" y="345" fill="#ef4444" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Adhesive Seal Breakdown</text>

    <text x="20" y="390" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TYPICAL 200 LF COST</text>
    <text x="20" y="420" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="28" font-weight="900">$400 – $600</text>
    <text x="20" y="445" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">DIY parts only (Ladder hazard)</text>
  </g>

  <!-- Bottom Proof Footnote -->
  <text x="60" y="740" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">
    Hydrodynamic flow tested at standard 1/4" per foot slope. Micro-mesh manufactured in accordance with ASTM A240/A480 marine alloy specifications.
  </text>
</svg>
