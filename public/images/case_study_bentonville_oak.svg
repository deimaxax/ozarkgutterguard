    <path d="M 320 100 Q 340 160 330 220 Q 320 280 340 320" />
    <path d="M 440 120 Q 460 170 450 230 Q 440 280 460 330" />
    <path d="M 540 160 Q 560 210 550 260 Q 540 310 560 350" />
  </g>

  <!-- Right Information Specs -->
  <g transform="translate(640, 80)">
