<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="meshPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 12 M 12 0 L 0 12" stroke="#64748b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#meshPattern)" />

  <!-- Subdued Ozark Topographical Contour Waves -->
  <path d="M 0 480 Q 300 420 600 500 T 1200 450 L 1200 630 L 0 630 Z" fill="#0f172a" opacity="0.6" />
  <path d="M 0 530 Q 350 490 700 560 T 1200 520 L 1200 630 L 0 630 Z" fill="#020617" opacity="0.8" />

  <!-- Architectural House & Roofline Wireframe -->
  <g transform="translate(680, 120)">
    <!-- Roof Gable -->
    <polygon points="220,40 440,190 0,190" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <!-- Secondary Ridge -->
    <polygon points="120,90 280,190 0,190" fill="#0f172a" stroke="#ea580c" stroke-width="3" />
    <!-- Gutter Section with Stainless Micro-Mesh Highlight -->
    <rect x="-20" y="185" width="480" height="16" rx="4" fill="#334155" stroke="#f97316" stroke-width="3" />
    <!-- 50-Micron Filtration Grid Representation -->
    <line x1="-15" y1="187" x2="455" y2="187" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2" />
    <!-- Downspout Drop -->
    <path d="M 430 201 L 430 360 L 460 380" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
    
    <!-- Rain Intake Flow -->
    <g stroke="#38bdf8" stroke-width="2" opacity="0.7">
      <line x1="80" y1="80" x2="100" y2="180" stroke-dasharray="8,6" />
      <line x1="160" y1="60" x2="180" y2="180" stroke-dasharray="8,6" />
      <line x1="240" y1="50" x2="260" y2="180" stroke-dasharray="8,6" />
      <line x1="320" y1="70" x2="340" y2="180" stroke-dasharray="8,6" />
      <line x1="390" y1="110" x2="410" y2="180" stroke-dasharray="8,6" />
    </g>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(80, 110)">
    <!-- Entity Badge -->
    <rect x="0" y="0" width="380" height="36" rx="18" fill="#1e293b" stroke="#ea580c" stroke-width="1.5" />
    <text x="20" y="23" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">NORTHWEST ARKANSAS SURGICAL ARMOR</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">OZARK GUTTER GUARD CO.</text>
    <text x="0" y="140" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">316 Surgical Stainless Micro-Mesh Systems</text>

    <!-- Specs Pill Grid -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="160" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="26" fill="#ea580c" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">FLOW TESTED</text>
      <text x="16" y="48" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">150 in/hr</text>

      <rect x="175" y="0" width="160" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="191" y="26" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">MICRON SIZE</text>
      <text x="191" y="48" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">50 Microns</text>

      <rect x="350" y="0" width="180" height="60" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="366" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">NO-CLOG GUARANTEE</text>
      <text x="366" y="48" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">10-Yr Transferable</text>
    </g>

    <!-- Entity Ground-Truth Proof Strip -->
    <g transform="translate(0, 270)">
      <text x="0" y="20" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">📍 Headquarters: 1102 S Walton Blvd, Bentonville, AR 72712</text>
      <text x="0" y="46" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">📞 Dispatch: (479) 929-2516 • AR Specialty Contractor License #OGG-479-NWA</text>
      <text x="0" y="72" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✓ 100% Shingle-Safe Fascia Mount • Zero Warranty Void Risk</text>
    </g>
  </g>

  <!-- Bottom Authority Accent Bar -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#orangeGrad)" />
</svg>
